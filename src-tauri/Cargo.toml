[package]
name = "pp-doctor"
version = "0.1.0"
description = "PP Doctor — Windows manager for PPDoctor cabinets"
authors = ["PP Doctor"]
edition = "2021"

[lib]
name = "pp_doctor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Raw LZ4 block codec for the .b2scache writer — output is LZ4_compress_default
# compatible (what the Pi's LZ4_decompress_safe / lz4js reader expects).
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
# bundled = compile SQLite from source — no system dep, single-exe ship
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
base64 = "0.22"
# Update-check HTTP (anonymous GitHub API + asset downloads).
# Lightweight blocking HTTP client (~200 KB compiled vs reqwest's ~4 MB).
# `tls` feature uses native-tls so we link Windows' built-in SChannel
# instead of bundling 2 MB of rustls; matches "small exe" tauri goals.
ureq = { version = "2", features = ["json", "tls"], default-features = false }
sha2 = "0.10"
hex = "0.4"
# Native SSH client (replaces shelling out to ssh.exe).
# - russh = pure Rust SSH-2, single self-contained binary; no Windows
#   OpenSSH dependency, no console-window spawns per call.
# - russh-keys = OpenSSH key file loading (id_ed25519, id_rsa).
# - russh-sftp = SFTP subsystem on top of russh, replaces shelling
#   out to scp.exe with file transfer over the same TCP+auth handshake.
# - tokio = async runtime (Tauri 2 already pulls this in transitively).
# - async-trait = trait async fns on stable.
# - parking_lot = lighter Mutex for the connection pool than std's.
russh = "0.45"
russh-keys = "0.45"
russh-sftp = "2"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
parking_lot = "0.12"

# Size-optimized release build (matches the "small single exe" goal above).
# strip drops debug symbols (the biggest single win), lto + codegen-units=1
# let the optimizer shrink across crate boundaries. opt-level stays at the
# default 3 so runtime perf is unchanged.
[profile.release]
strip = true
lto = true
codegen-units = 1
