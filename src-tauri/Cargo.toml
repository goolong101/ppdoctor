[package]
name = "pp-doctor"
version = "0.1.0"
description = "PP Doctor — Windows manager for PPEnhancer cabinets"
authors = ["PP Doctor"]
edition = "2021"

[lib]
name = "pp_doctor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bundled = compile SQLite from source — no system dep, single-exe ship
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
base64 = "0.22"
