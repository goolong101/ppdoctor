[package]
name = "pp-doctor"
version = "0.1.0"
description = "PP Doctor — Windows manager for PPEnhancer cabinets"
authors = ["PP Doctor"]
edition = "2021"

[lib]
name = "pp_doctor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bundled = compile SQLite from source — no system dep, single-exe ship
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
base64 = "0.22"
# Update-check HTTP (anonymous GitHub API + asset downloads).
# Lightweight blocking HTTP client (~200 KB compiled vs reqwest's ~4 MB).
# `tls` feature uses native-tls so we link Windows' built-in SChannel
# instead of bundling 2 MB of rustls; matches "small exe" tauri goals.
ureq = { version = "2", features = ["json", "tls"], default-features = false }
sha2 = "0.10"
hex = "0.4"
